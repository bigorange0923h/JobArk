[alembic]
# Migration scripts live in backend/migrations.
script_location = migrations

# Makes the `app` package importable when alembic is invoked from another directory.
prepend_sys_path = .

# Alembic requires an explicit separator for the path list above. Without it every command
# emits a DeprecationWarning, which the test suite treats as a failure.
path_separator = os

# The connection string is intentionally left empty: migrations/env.py injects it from
# application settings (JOBARK_DATABASE_URL), so credentials never enter version control.
sqlalchemy.url =

# ---------------------------------------------------------------------------------------
# IMPORTANT: this file must stay ASCII-only.
#
# configparser reads alembic.ini using the *locale* encoding (cp936 on a Chinese Windows
# install). A single non-ASCII character here makes every alembic command fail with
# UnicodeDecodeError before any migration runs. Project convention is Chinese comments,
# so this is a deliberate, documented exception; Python 3.15+ (UTF-8 mode by default)
# will make it unnecessary.
#
# Revision ids are readable increments (0001, 0002, ...) instead of random hashes,
# created with: alembic revision --rev-id 0002 -m "..."
# ---------------------------------------------------------------------------------------
