[project]
name = "jobark"
version = "0.1.0"
description = "JobArk 后端：个人求职工作台的领域服务与受控 AI 能力。"
# 后端工程根位于 backend/，本文件是其唯一的依赖与版本声明处。
# requires-python 与 uv.lock 保持一致；调整前必须确认部署环境的解释器版本。
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
]

# 仅开发与测试使用；生产镜像安装依赖时不应包含该组。
[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx2>=2.13.0",
    "pytest-asyncio>=1.4.0",
    "pyright>=1.1.414",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 保证从任意工作目录运行 pytest 时都能导入 app 包。
pythonpath = ["."]
addopts = "-ra"
# 警告即失败：漏写 await、使用弃用 API、未关闭的资源等问题必须当场暴露，
# 不能被"测试通过"掩盖。后出现的条目优先级更高，因此定向豁免写在后面。
filterwarnings = [
    "error",
    # 定向豁免：Starlette 测试客户端内部引用了 anyio 的弃用别名，属第三方代码，
    # 本项目无可修复动作，待上游修复后删除本条。
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning",
]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
# 严格模式：漏写 await 会静默失效，必须由类型检查兜住，而不是靠人工评审。
typeCheckingMode = "strict"
include = ["app", "tests", "migrations"]
