[project]
name = "jobark"
version = "0.1.0"
description = "JobArk 后端：个人求职工作台的领域服务与受控 AI 能力。"
# 后端工程根位于 backend/，本文件是其唯一的依赖与版本声明处。
# requires-python 与 uv.lock 保持一致；调整前必须确认部署环境的解释器版本。
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.31.0",
    "alembic>=1.20.0",
]

# 仅开发与测试使用；生产镜像安装依赖时不应包含该组。
[dependency-groups]
dev = [
    "pytest>=8.4",
    "httpx2>=2.13.0",
    "pytest-asyncio>=1.4.0",
    "pyright>=1.1.414",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 保证从任意工作目录运行 pytest 时都能导入 app 包。
pythonpath = ["."]
addopts = "-ra"
# 警告即失败：漏写 await、使用弃用 API、未关闭的资源等问题必须当场暴露，
# 不能被"测试通过"掩盖。后出现的条目优先级更高，因此定向豁免写在后面。
filterwarnings = [
    "error",
    # 定向豁免：Starlette 测试客户端内部引用了 anyio 的弃用别名，属第三方代码，
    # 本项目无可修复动作，待上游修复后删除本条。
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning",
]
asyncio_mode = "auto"

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
# 严格模式：漏写 await 会静默失效，必须由类型检查兜住，而不是靠人工评审。
typeCheckingMode = "strict"
include = ["app", "tests", "migrations"]

[tool.ruff]
target-version = "py314"
# 120 列：与现有代码的实际排版一致，避免引入规则时产生大范围无关重排。
line-length = 120
src = ["app", "tests", "migrations"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle 错误
    "W",    # pycodestyle 警告
    "F",    # pyflakes：未使用导入与变量等
    "I",    # 导入排序
    "UP",   # pyupgrade：改用目标版本的新写法
    "B",    # flake8-bugbear：常见缺陷模式
    "SIM",  # flake8-simplify
    "C4",   # 推导式写法
]
# 刻意不启用 "D"（docstring 规则）：项目注释为中文，而 D 规则内含英文语气与段落约定，
# 会产生大量噪声却拦不住真正的问题。docstring 完整性由 AGENTS.md 与代码评审约束。

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# Alembic 自动生成的脚本由工具排版：其中大量行是模型里的中文列注释，必然超过 120 列，
# 而手工换行会在下次 autogenerate 时被覆盖。可读性的源头是 app/ 下的模型定义。
"migrations/versions/*.py" = ["E501"]

[tool.ruff.format]
# 同上：不对生成脚本做格式化，避免每次 autogenerate 都产生纯排版差异。
exclude = ["migrations/versions/*.py"]

[tool.ruff.lint.flake8-bugbear]
# B008：FastAPI 的依赖注入惯用「函数调用作为默认值」，是框架规定写法而非缺陷。
extend-immutable-calls = ["fastapi.Depends"]
