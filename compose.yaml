services:
  postgres:
    build:
      context: ./deploy/postgres
    image: jobark-postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobark}
      POSTGRES_USER: ${POSTGRES_USER:-jobark_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在项目根目录的 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - jobark_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  jobark_postgres_data:
